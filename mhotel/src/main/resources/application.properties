# standalone (java -jar) only; inside Tomcat the port is set in tomcat/server.xml
server.port=${MHOTEL_PORT:8083}
spring.jmx.enabled=false
spring.application.name=mhotel

spring.datasource.url=${MHOTEL_DB_URL:jdbc:mysql://localhost:3306/mhotel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${MHOTEL_DB_USER:root}
spring.datasource.password=${MHOTEL_DB_PASS:root}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=mhotel-pool

# schema.sql is CREATE TABLE IF NOT EXISTS, runs on every start. Column changes for existing DBs go in Migrations.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# phones must reload index.html after an update
spring.web.resources.cache.cachecontrol.no-cache=true

# time zone used for "today", bill dates and receipts
mhotel.zone=${MHOTEL_ZONE:Asia/Kolkata}

# shared secret a delivery partner (Swiggy/Zomato) webhook must send in the X-Webhook-Secret header (empty = webhook disabled)
mhotel.webhook.secret=${MHOTEL_WEBHOOK_SECRET:}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
spring.jackson.default-property-inclusion=always

# WAR in an external Tomcat: force UTF-8 or Tamil pages garble (header charset beats <meta charset>)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
