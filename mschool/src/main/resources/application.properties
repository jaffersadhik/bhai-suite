# standalone (java -jar) only; inside Tomcat the port is set in tomcat/server.xml
server.port=${MSCHOOL_PORT:8081}
spring.jmx.enabled=false
spring.application.name=mschool

spring.datasource.url=${MSCHOOL_DB_URL:jdbc:mysql://localhost:3306/mschool?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${MSCHOOL_DB_USER:root}
spring.datasource.password=${MSCHOOL_DB_PASS:root}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=mschool-pool

# schema.sql is CREATE TABLE IF NOT EXISTS, runs on every start. Column changes for existing DBs go in SchoolMigrations.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# phones must reload index.html after an update
spring.web.resources.cache.cachecontrol.no-cache=true

# time zone used for "today", attendance dates and receipts
mschool.zone=${MSCHOOL_ZONE:Asia/Kolkata}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
spring.jackson.default-property-inclusion=always

# WAR in an external Tomcat: Tomcat answers ISO-8859-1 unless this is forced, which garbles every Tamil page (header charset beats <meta charset>)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
