<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Mukta+Malar:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&family=Noto+Sans+Malayalam:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<title>MSchool</title>
<style>
:root{/* the MBill look & feel: same green / gold, same fonts (leaf = --pri, gold = --gold) */
--pri:#0e6b4a;--pri2:#14805a;--pri-d:#09442f;--pri-l:#dff0e7;--gold:#e9b431;--gold-l:#fbe7ac;--bg:#f2f7f4;--card:#fff;--line:#dbe6df;--tx:#14231c;--mu:#5f6f66;
--ok:#1faa59;--ok-l:#e3f5ea;--bad:#b3261e;--bad-l:#fdecea;--warn:#d9770a;--warn-l:#fff1dc;--r:14px;
--body:'DM Sans','Noto Sans Tamil','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Arabic','Latha','Nirmala UI',system-ui,sans-serif;
--head:'Mukta Malar','DM Sans','Noto Sans Tamil','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Latha',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.4}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#bar .t{flex:1;min-width:0}#bar .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar .t small{opacity:.85;font-size:12px}
#bar button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:13px;padding:8px 11px;font-size:15px;min-height:42px;min-width:42px;font-weight:700}
#bar .mark{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--pri-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:22px;flex:none}
#bar .t b{font-family:var(--head);font-weight:800;font-size:18px}#bar .t small{color:var(--gold-l);font-weight:600}
h1,h2,h3,.card h3{font-family:var(--head)}
#ipfoot{text-align:center;font-size:11.5px;color:var(--mu);padding:4px 12px calc(76px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
#app.lg #ipfoot{display:none}
.tile i{filter:none}.fab{background:var(--pri)}
#main{flex:1;padding:12px 12px 12px}
#dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
#dock button{flex:1;border:0;background:none;padding:8px 2px 7px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
#dock button i{font-style:normal;font-size:20px}#dock button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.mu{color:var(--mu)}.sm{font-size:12px}.b{font-weight:700}.c{text-align:center}.r{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}.stat span{font-size:12px;color:var(--mu)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.pri b{color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;text-align:center;color:var(--tx);font-size:12.5px}
.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:3px}
button,input,select,textarea{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:600}
.btn.sec{background:var(--pri-l);color:var(--pri)}.btn.bad{background:var(--bad-l);color:var(--bad)}.btn.ok{background:var(--ok)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}.btn.full{width:100%}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--pri-l);color:var(--pri);text-decoration:none;border:0;font-size:16px}
.f{display:block;margin-bottom:10px}.f>span{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.f input,.f select,.f textarea,.inp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
.f input:focus,.f select:focus,.inp:focus{outline:2px solid var(--pri2);border-color:transparent}
.search{position:sticky;top:58px;z-index:5;background:var(--bg);padding:2px 0 8px}
.seg{display:flex;background:#e3eee8;border-radius:11px;padding:3px;margin-bottom:10px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--mu);font-size:13px}.seg button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.chip{display:inline-block;background:var(--pri-l);color:var(--pri);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.warn{background:var(--warn-l);color:var(--warn)}.chip.sel{background:var(--pri);color:#fff}
.pa{display:flex;gap:6px}.pa button{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--mu)}
.pa button.P.on{background:var(--ok);border-color:var(--ok);color:#fff}.pa button.A.on{background:var(--bad);border-color:var(--bad);color:#fff}
.pa button.L.on,.pa button.H.on{background:var(--warn);border-color:var(--warn);color:#fff}
.pa button.pass.on{background:var(--ok);border-color:var(--ok);color:#fff}.pa button.fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
.pa.w button{width:auto;padding:0 10px}
.savebar{position:sticky;bottom:64px;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;z-index:6}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:28px;box-shadow:0 4px 14px rgba(14,107,74,.4);z-index:15}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.hide{display:none!important}
#shade{position:fixed;inset:0;background:rgba(9,30,22,.5);z-index:40}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet .grab{width:42px;height:4px;border-radius:2px;background:#c7d6cd;margin:8px auto 0}
#sheet .sh-h{display:flex;align-items:center;padding:8px 14px 6px}#sheet .sh-h b{flex:1;font-size:16px}#sheet .sh-h button{border:0;background:#e8f1ec;border-radius:50%;width:32px;height:32px;font-size:15px}
#shB{overflow:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:90%;background:#14231c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.lg #main{padding:0}.lg #app,#app.lg{background:linear-gradient(160deg,#0e6b4a 0%,#09442f 100%)}
.login{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));color:#fff}
.login .brand{text-align:center;margin-bottom:22px}
.login .lmark{width:72px;height:72px;border-radius:22px;background:var(--gold);color:var(--pri-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:40px;margin:0 auto 12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.login h1{font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1;margin:6px 0 0;color:#fff}.login h1 span{color:var(--gold)}
.login .tag{font-size:13px;font-weight:600;opacity:.88;margin-top:4px}
.lcard{background:var(--bg);color:var(--tx);border-radius:22px;padding:20px 16px;box-shadow:0 14px 34px rgba(0,0,0,.25);position:relative}
.lcard::before{content:"";position:absolute;left:24px;right:24px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
.lcard h2{font-family:var(--head);font-size:21px;font-weight:800;margin:0}.lcard .sub{font-size:13px;color:var(--mu);margin:2px 0 6px}
.lcard .f input{padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-weight:600}
.lcard .btn.full{height:54px;border-radius:15px;font-size:16px;font-weight:700;margin-top:6px}
.lerr{display:none;margin:10px 0 0;background:var(--bad-l);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}.lerr.on{display:block}.lerr.blk{background:#fff3cd;color:#7a4b00}
.cap{display:flex;gap:8px;align-items:stretch;margin:2px 0 8px}
.cap button.capimg{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:56px}
.cap button.capimg img{width:100%;max-width:230px;height:auto;display:block}
.cap button.caprf{flex:0 0 48px;border:1.5px solid var(--line);border-radius:12px;background:var(--pri-l);color:var(--pri-d);font-size:20px;cursor:pointer}
#lc{letter-spacing:.35em;text-transform:uppercase;font-weight:800;font-size:20px;text-align:center}
#lc::placeholder{letter-spacing:0;text-transform:none;font-weight:500;font-size:14px}
.login .lfoot{text-align:center;font-size:12px;opacity:.85;margin-top:16px;font-variant-numeric:tabular-nums}
.login .langbtn{position:absolute}
.lang-row{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;color:var(--tx);cursor:pointer}
.lang-opt{display:flex;gap:8px;align-items:center;margin:10px 2px;font-size:13px}
.blkrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:8px;background:#e3eee8;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}table.t th{color:var(--mu);font-weight:600;font-size:12px}table.t td.n,table.t th.n{text-align:right}
.rcpt{border:1px dashed #b5c9bd;border-radius:12px;padding:12px;background:#fbfdfc}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mu)}
.sec-h{font-size:13px;color:var(--mu);font-weight:700;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.3px}
.spin{text-align:center;padding:30px;color:var(--mu)}
@media print{body *{visibility:hidden}#shB,#shB *{visibility:visible}#sheet{position:absolute;left:0;top:0;transform:none;max-width:none;box-shadow:none}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"><header id="bar"></header><main id="main"></main><footer id="ipfoot">உங்கள் IP (Your IP): <b class="myipv">…</b></footer><nav id="dock"></nav></div>
<div id="shade" class="hide" data-act="closeSheet"></div>
<div id="sheet" class="hide"><div class="grab"></div><div class="sh-h"><b id="shT"></b><button data-act="closeSheet" aria-label="மூடு">✕</button></div><div id="shB"></div></div>
<div id="toast"></div>
<script>window.I18N_PERSIST=true;</script>
<script src="i18n.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const todayS=()=>ymd(new Date());
const monthS=()=>todayS().slice(0,7);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const num=n=>Number(n||0);
const dmy=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:s};
const waLink=(p,t)=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(t)};
const telLink=p=>'tel:'+String(p||'').replace(/[^\d+]/g,'');
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const KIND={school:'பள்ளி',college:'கல்லூரி',university:'பல்கலைக்கழகம்'};
const ROLE={admin:'நிர்வாகி',principal:'முதல்வர்',office:'அலுவலகம்',teacher:'ஆசிரியர்'};
const MODES=['Cash','UPI','Card','Cheque','Bank'];
const MODE_TA={Cash:'ரொக்கம்',UPI:'UPI',Card:'கார்டு',Cheque:'காசோலை',Bank:'வங்கி'};

let S={token:localStorage.getItem('ms_token'),me:null,data:null,dash:null,view:'home',hist:[],busy:false};

async function api(path,method,body){
  const r=await fetch('/api'+path,{method:method||'GET',headers:{'Content-Type':'application/json',...(S.token?{'X-Auth':S.token}:{})},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&S.token&&path!=='/login'){localLogout();throw new Error((j&&j.error)||'மீண்டும் உள்நுழையவும்')}
  if(!r.ok){const er=new Error((j&&j.error)||'பிழை ('+r.status+')');er.status=r.status;er.data=j||{};throw er}
  return j;
}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',err?4200:2200)}
async function run(fn){try{await fn()}catch(e){toast(e.message||String(e),true)}}

/* ---------- roles ---------- */
const role=()=>S.me&&S.me.user.type;
const isAdmin=()=>role()==='admin',isHead=()=>role()==='admin'||role()==='principal',isDesk=()=>isHead()||role()==='office',isTeacher=()=>role()==='teacher';
const myStaff=()=>S.me&&S.me.user.staffId;

/* ---------- data helpers ---------- */
const D=()=>S.data||{classes:[],sections:[],rooms:[],heads:[],years:[],teachers:[]};
const cls=id=>D().classes.find(c=>c.id==id);
const sec=id=>D().sections.find(s=>s.id==id);
const secsOf=cid=>D().sections.filter(s=>s.class_id==cid);
const secLabel=s=>{if(!s)return '';const c=cls(s.class_id);return (c?c.name:'')+' '+s.name};
const curYear=()=>D().years.find(y=>y.is_current)||null;
const mySections=()=>isTeacher()?D().sections.filter(s=>s.class_teacher_id==myStaff()):D().sections;
const opts=(arr,val,fn,blank)=>(blank?'<option value="">'+esc(blank)+'</option>':'')+arr.map(x=>{const [v,t]=fn(x);return '<option value="'+esc(v)+'"'+(String(v)===String(val==null?'':val)?' selected':'')+'>'+esc(t)+'</option>'}).join('');
const classOpts=(val,blank)=>opts(D().classes,val,c=>[c.id,c.name],blank);
const sectionOpts=(val,blank,list)=>opts(list||D().sections,val,s=>[s.id,secLabel(s)],blank);
const modeOpts=v=>opts(MODES,v||'Cash',m=>[m,MODE_TA[m]]);
const field=(label,id,val,extra)=>'<label class="f"><span>'+label+'</span><input id="'+id+'" value="'+esc(val)+'" '+(extra||'')+'></label>';
const selField=(label,id,optsHtml,chg)=>'<label class="f"><span>'+label+'</span><select id="'+id+'"'+(chg?' data-chg="'+chg+'"':'')+'>'+optsHtml+'</select></label>';
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const contact=(phone,text)=>phone?'<a class="ib" href="'+telLink(phone)+'" title="அழை">📞</a> <a class="ib" target="_blank" rel="noopener" href="'+waLink(phone,text||'')+'" title="WhatsApp">💬</a>':'';

/* ---------- sheet ---------- */
function sheet(title,html){$('#shT').textContent=title;$('#shB').innerHTML=html;$('#sheet').classList.remove('hide');$('#shade').classList.remove('hide');$('#shB').scrollTop=0}
window.msSheet=(t,h)=>sheet(t,h);
function closeSheet(){$('#sheet').classList.add('hide');$('#shade').classList.add('hide');$('#shB').innerHTML=''}
const sheetOpen=()=>!$('#sheet').classList.contains('hide');

/* ---------- navigation ---------- */
const DOCK_ROOT={home:1,students:1,attendance:1,fees:1,more:1};
function go(view,params){
  closeSheet();
  if(S.view&&S.view!==view)S.hist.push(S.view);
  if(S.hist.length>30)S.hist.shift();
  S.view=view;S.vp=params||{};
  window.scrollTo(0,0);
  const L=LOAD[view];
  render();
  if(L)run(async()=>{S.busy=true;render();try{await L()}finally{S.busy=false;render()}});
}
function back(){closeSheet();const v=S.hist.pop()||'home';S.view=v;render();const L=LOAD[v];if(L)run(async()=>{await L();render()})}

function render(){renderBar();renderMain();renderDock()}
function renderBar(){
  const b=$('#bar');
  $('#app').classList.toggle('lg',!S.me);
  if(!S.me){b.classList.add('hide');return}
  b.classList.remove('hide');
  const inst=S.me.inst,y=curYear();
  const title=S.view==='admin'?'நிறுவனங்கள்':(inst?inst.name:'MSchool');
  const sub=ROLE[role()]+' · '+esc(S.me.user.name)+(y?' · '+esc(y.name):'');
  b.innerHTML=(S.view!=='home'&&S.view!=='admin'&&!(S.view==='more')?'<button data-act="back" aria-label="பின்">←</button>':'<div class="mark">🎓</div>')+'<div class="t"><b>'+esc(title)+'</b><small>'+sub+'</small></div>'+(isAdmin()&&S.view!=='admin'?'<button data-act="goAdmin" title="நிறுவனம் மாற்று">🏛</button>':'')+'<button id="langBtn" aria-label="Language">🌐</button>'+(isAdmin()&&S.view==='admin'?'<button data-act="logout" aria-label="Logout">⎋</button>':'');
}
function dockItems(){
  if(isAdmin()&&!S.me.inst)return [];
  const a=[['home','🏠','முகப்பு'],['students','🧑‍🎓','மாணவர்'],['attendance','📋','வருகை']];
  if(isDesk())a.push(['fees','💰','கட்டணம்']);
  a.push(['more','☰','மேலும்']);
  return a;
}
function renderDock(){
  const d=$('#dock');const items=S.me?dockItems():[];
  if(!items.length){d.classList.add('hide');return}
  d.classList.remove('hide');
  const cur=DOCK_ROOT[S.view]?S.view:'more';
  d.innerHTML=items.map(([k,i,t])=>'<button data-act="nav" data-v="'+k+'" class="'+(k===cur?'on':'')+'"><i>'+i+'</i>'+t+'</button>').join('');
}
function renderMain(){
  const m=$('#main');
  if(!S.me){m.innerHTML=loginView();return}
  const f=VIEW[S.view];
  m.innerHTML=f?f():'<div class="empty">—</div>';
  if(AFTER[S.view])AFTER[S.view]();
}

function lerrShow(msg,blk){S.lerr=msg||'';S.blk=!!blk;const e=$('#lerr');if(e){e.textContent=S.lerr;e.classList.toggle('on',!!S.lerr);e.classList.toggle('blk',!!blk)}const b=$('#lbtn');if(b)b.disabled=!!blk}
function capApply(c){
  S.cap=c||{};const box=$('#capBox');
  if(box)box.classList.toggle('hide',!(S.cap.enabled&&S.cap.image));
  const pic=$('#capPic');if(pic&&S.cap.image)pic.src=S.cap.image;
  const inp=$('#lc');if(inp)inp.value='';
}
async function loadCaptcha(){
  try{capApply(await api('/captcha'))}
  catch(e){
    if(e.status===403&&e.data&&e.data.blocked){S.cap={};capApply({});lerrShow(e.message,true);return}
    if(e.status===429){lerrShow(e.message);return}
    capApply({})
  }
}
async function loadMyIp(){
  try{S.ip=(await api('/myip')).ip||'—'}catch(e){S.ip='—'}
  document.querySelectorAll('.myipv').forEach(n=>n.textContent=S.ip);
}

A.login=async()=>{
  const u=val('lu'),p=$('#lp').value,cap=val('lc'),c=S.cap||{};
  if(!u||!p){lerrShow('பயனர் பெயர் மற்றும் கடவுச்சொல் தேவை');return}
  if(c.enabled&&!cap){lerrShow('படத்தில் உள்ள Captcha எழுத்துகளை உள்ளிடவும்');$('#lc').focus();return}
  lerrShow('');const b=$('#lbtn');if(b)b.disabled=true;
  let r;
  try{r=await api('/login','POST',{user:u,pass:p,captchaId:c.id||'',captcha:cap})}
  catch(e){
    $('#lp').value='';
    if(e.data&&e.data.blocked){S.cap={};capApply({});lerrShow(e.message,true);return}
    const msg=e.message;
    if(e.status!==undefined&&e.status!==0){await loadCaptcha()}      // every attempt needs a fresh picture
    lerrShow(msg);if(b&&!S.blk)b.disabled=false;
    (c.enabled?$('#lc'):$('#lp'))&&(c.enabled?$('#lc'):$('#lp')).focus();return
  }
  S.token=r.token;localStorage.setItem('ms_token',r.token);S.cap=null;S.lerr='';await afterLogin();
};

  const s=r.student,y=curYear(),cur=y&&r.history.find(h=>h.year_id==y.id),att=r.attendance;

  let h='<div class="row" style="margin-bottom:8px"><div class="av">'+initials(s.name)+'</div><div class="sp"><b style="font-size:17px">'+esc(s.name)+'</b><div class="sm mu">'+esc(s.adm_no)+(cur?' · '+esc(cur.class_name)+' '+esc(cur.section_name||'')+(cur.roll_no?' · வ.எண் '+cur.roll_no:''):'')+'</div></div>'+contact(s.phone,'வணக்கம், '+s.name+' பற்றி…')+'</div>';
  if(s.status!=='active')h+='<span class="chip warn">'+(s.status==='left'?'விலகியவர்':'படிப்பு முடித்தவர்')+'</span>';
  h+='<div class="card" style="margin-top:6px">'
   +kv('பாலினம்',genderTa[s.gender]||'')+kv('பிறந்த தேதி',dmy(s.dob))+kv('தந்தை',s.father_name)+kv('தாய்',s.mother_name)+kv('தொலைபேசி',s.phone)+kv('மாற்று தொலைபேசி',s.phone2)+kv('முகவரி',s.address)+kv('சேர்ந்த தேதி',dmy(s.joined_on))+(s.notes?kv('குறிப்பு',s.notes):'')+'</div>';
  h+='<div class="card"><h3>வருகை (இந்த ஆண்டு)</h3><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row sm" style="margin-top:6px"><span class="chip ok">வந்தது '+num(att.present)+'</span><span class="chip bad">வரவில்லை '+num(att.absent)+'</span><span class="chip warn">விடுப்பு '+num(att.leave)+'</span><span class="sp r b">'+pct+'%</span></div></div>';
  if(fs){

    h+='<div class="card"><h3>கட்டணம் ('+esc(fs.year.name)+')</h3><div class="grid3"><div class="c"><b>'+inr(t.fee-t.concession)+'</b><div class="sm mu">கட்டணம்</div></div><div class="c"><b style="color:var(--ok)">'+inr(t.paid)+'</b><div class="sm mu">செலுத்தியது</div></div><div class="c"><b style="color:var(--bad)">'+inr(t.balance)+'</b><div class="sm mu">பாக்கி</div></div></div>'
     +'<button class="btn full" style="margin-top:10px" data-act="collect" data-id="'+s.id+'">தொகை வசூலி / ரசீது</button></div>';
  }

  sheet('மாணவர் விவரம்',h);

/* collect */
async function openCollect(id,yearId){
  const fs=await api('/fees/student/'+id+(yearId?'?yearId='+yearId:'')),s=fs.student,t=fs.totals;
  let h='<div class="row" style="margin-bottom:6px"><div class="av">'+initials(s.name)+'</div><div class="sp"><b style="font-size:16px">'+esc(s.name)+'</b><div class="sm mu">'+esc(s.adm_no)+(fs.enrollment?' · '+esc(fs.enrollment.class_name)+' '+esc(fs.enrollment.section_name||''):'')+'</div></div></div>';
  h+=selField('கல்வியாண்டு','payYear',opts(D().years,fs.year.id,y=>[y.id,y.name]),'payYear');
  if(!fs.heads.length)return sheet('கட்டணம் வசூல்',h+'<div class="empty">இந்த ஆண்டுக்கு கட்டண அமைப்பு இல்லை அல்லது மாணவர் இந்த ஆண்டில் பதிவு செய்யப்படவில்லை.</div>')||(S.pay={id,yearId:fs.year.id});
  S.pay={id,yearId:fs.year.id,bal:{}};
  h+='<table class="t"><tr><th>வகை</th><th class="n">கட்டணம்</th><th class="n">பாக்கி</th><th class="n">செலுத்த</th></tr>'+fs.heads.map(x=>{S.pay.bal[x.head_id]=num(x.balance);
    return '<tr><td>'+esc(x.name)+(num(x.concession)?'<div class="sm mu">சலுகை −'+inr(x.concession)+'</div>':'')+(isHead()?' <a href="#" data-act="concess" data-h="'+x.head_id+'" data-c="'+num(x.concession)+'" class="sm" style="color:var(--pri)">✂</a>':'')+'</td><td class="n">'+inr(num(x.fee)-num(x.concession))+'</td><td class="n" style="color:'+(num(x.balance)?'var(--bad)':'var(--ok)')+'">'+(num(x.balance)?inr(x.balance):'✔')+'</td><td class="n">'+(num(x.balance)?'<input class="inp" style="width:84px;padding:6px" inputmode="numeric" id="pay_'+x.head_id+'" data-inp="payTot" placeholder="0">':'')+'</td></tr>'}).join('')
   +'<tr><td class="b">மொத்தம்</td><td class="n b">'+inr(t.fee-t.concession)+'</td><td class="n b">'+inr(t.balance)+'</td><td class="n b" id="payTotal">₹0</td></tr></table>';
  if(t.balance>0)h+='<div class="row" style="margin:10px 0"><button class="btn sec sm" data-act="payFill">அனைத்து பாக்கியும் நிரப்பு</button></div>'
   +'<div class="grid2">'+selField('செலுத்தும் முறை','payMode',modeOpts('Cash'))+field('குறிப்பு','payNote','')+'</div><button class="btn ok full" data-act="payGo">ரசீது உருவாக்கு</button>';
  else h+='<div class="card" style="border-color:var(--ok);margin-top:10px"><b style="color:var(--ok)">இந்த ஆண்டு கட்டணம் முழுவதும் செலுத்தப்பட்டது ✔</b></div>';
  if(fs.receipts.length)h+='<div class="sec-h">முந்தைய ரசீதுகள்</div>'+fs.receipts.map(r=>'<div class="li" data-act="viewRcpt" data-id="'+r.id+'"><div class="sp"><b>'+esc(r.receipt_no)+'</b><div class="sm mu">'+esc(String(r.created_at).slice(0,16))+' · '+esc(MODE_TA[r.pay_mode]||r.pay_mode)+'</div></div>'+(r.status!=='ok'?'<span class="chip bad">ரத்து</span>':'')+'<b>'+inr(r.total)+'</b></div>').join('');
  sheet('கட்டணம் வசூல்',h);
}
A.collect=el=>openCollect(el.dataset.id);
C.payYear=el=>openCollect(S.pay.id,el.value);
I.payTot=()=>{let t=0;Object.keys(S.pay.bal).forEach(k=>{const e=$('#pay_'+k);if(e)t+=num(e.value)});const e=$('#payTotal');if(e)e.textContent=inr(t)};
A.payFill=()=>{Object.entries(S.pay.bal).forEach(([k,b])=>{const e=$('#pay_'+k);if(e)e.value=b||''});I.payTot()};
A.concess=async el=>{
  const v=prompt('இந்த கட்டணத்திற்கான சலுகை தொகை (₹) — 0 என்றால் நீக்கும்',el.dataset.c);if(v===null)return;
  await api('/fees/concession','POST',{studentId:S.pay.id,headId:+el.dataset.h,yearId:S.pay.yearId,amount:+v||0});toast('சலுகை பதிவானது');await openCollect(S.pay.id,S.pay.yearId);
};
A.payGo=async()=>{
  const lines=Object.keys(S.pay.bal).map(k=>({headId:+k,amount:num(val('pay_'+k))})).filter(l=>l.amount>0);
  if(!lines.length){toast('செலுத்தும் தொகையை உள்ளிடவும்',true);return}
  const r=await api('/fees/receipt','POST',{studentId:S.pay.id,yearId:S.pay.yearId,mode:val('payMode'),note:val('payNote'),lines});
  toast('ரசீது '+r.receipt_no+' உருவாக்கப்பட்டது');showReceipt(r);
  if(S.view==='fees'){await LOAD.fees();render()}else if(S.view==='home'){await LOAD.home();render()}
};
function receiptText(r){
  return '*'+S.me.inst.name+'*\nகட்டண ரசீது '+r.receipt_no+'\nதேதி: '+dmy(r.created_at)+'\nமாணவர்: '+r.student_name+(r.class_name?' ('+r.class_name+' '+(r.section_name||'')+')':'')+'\n'+r.lines.map(l=>l.head_name+': '+inr(l.amount)).join('\n')+'\n*மொத்தம்: '+inr(r.total)+'* ('+(MODE_TA[r.pay_mode]||r.pay_mode)+')\nநன்றி.';
}
function showReceipt(r){
  let h='<div class="rcpt">'+(r.status!=='ok'?'<div class="chip bad" style="display:block;text-align:center;margin-bottom:8px">ரத்து செய்யப்பட்டது'+(r.cancel_reason?' — '+esc(r.cancel_reason):'')+'</div>':'')
   +'<div class="c b" style="font-size:16px">'+esc(S.me.inst.name)+'</div><div class="c sm mu" style="margin-bottom:8px">'+esc(S.me.inst.address||'')+' '+esc(S.me.inst.phone||'')+'</div><div class="c b" style="margin-bottom:6px">கட்டண ரசீது</div>'
   +kv('ரசீது எண்',r.receipt_no)+kv('தேதி',dmy(r.created_at)+' '+String(r.created_at).slice(11,16))+kv('மாணவர்',r.student_name+' ('+r.adm_no+')')+kv('வகுப்பு',(r.class_name||'')+' '+(r.section_name||''))+kv('கல்வியாண்டு',r.year_name)
   +'<table class="t" style="margin-top:6px">'+r.lines.map(l=>'<tr><td>'+esc(l.head_name)+'</td><td class="n">'+inr(l.amount)+'</td></tr>').join('')+'<tr><td class="b">மொத்தம்</td><td class="n b">'+inr(r.total)+'</td></tr></table>'
   +kv('செலுத்திய முறை',MODE_TA[r.pay_mode]||r.pay_mode)+(r.note?kv('குறிப்பு',r.note):'')+kv('பெற்றவர்',r.created_by)+'</div>'
   +'<div class="grid2 noprint" style="margin-top:10px"><a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+waLink(r.phone,receiptText(r))+'">💬 WhatsApp</a><button class="btn sec" onclick="window.print()">🖨 அச்சிடு</button></div>'
   +(r.status==='ok'?'<button class="btn bad full noprint" style="margin-top:8px" data-act="rcptCancel" data-id="'+r.id+'">ரசீதை ரத்து செய்</button>':'');
  sheet('ரசீது '+r.receipt_no,h);
}
A.viewRcpt=async el=>showReceipt(await api('/fees/receipt/'+el.dataset.id));
A.rcptCancel=async el=>{
  const why=prompt('ரத்து செய்வதற்கான காரணம்');if(!why)return;
  await api('/fees/receipt/'+el.dataset.id+'/cancel','POST',{reason:why});toast('ரசீது ரத்து செய்யப்பட்டது');
  showReceipt(await api('/fees/receipt/'+el.dataset.id));if(S.view==='fees'){await LOAD.fees();render()}
};

S.pr={month:monthS(),data:null};
LOAD.payroll=async()=>{S.pr.data=await api('/payroll?month='+S.pr.month)};
VIEW.payroll=()=>{
  const p=S.pr,d=p.data;
  let h='<label class="f"><span>மாதம்</span><input type="month" id="prMon" value="'+esc(p.month)+'" max="'+monthS()+'" data-chg="prMonth"></label>';
  if(!d)return h+spin();
  const t=d.totals;
  h+='<div class="grid3" style="margin-bottom:10px"><div class="stat pri"><b style="font-size:17px">'+inr(t.net)+'</b><span>மொத்தம்</span></div><div class="stat ok"><b style="font-size:17px">'+inr(t.paid)+'</b><span>செலுத்தியது</span></div><div class="stat bad"><b style="font-size:17px">'+inr(t.due)+'</b><span>பாக்கி</span></div></div>';
  if(num(d.notGenerated)>0)h+='<button class="btn full" style="margin-bottom:8px" data-act="prGen">⚙️ சம்பளம் உருவாக்கு ('+d.notGenerated+' ஊழியர்)</button>';
  if(d.rows.length&&t.due>0)h+='<div class="grid2" style="margin-bottom:10px"><button class="btn sec sm" data-act="prRegen">🔄 மீண்டும் கணக்கிடு</button><button class="btn ok sm" data-act="prPayAll">அனைவருக்கும் செலுத்து</button></div>';
  if(!d.rows.length)h+='<div class="empty">இந்த மாதத்திற்கு சம்பளம் இன்னும் உருவாக்கப்படவில்லை.<br><span class="sm">வருகை பதிவுகளின் அடிப்படையில் தானாக கணக்கிடப்படும்.</span></div>';
  h+=d.rows.map(r=>'<div class="li" data-act="prOpen" data-id="'+r.id+'"><div class="av">'+initials(r.staff_name)+'</div><div class="sp"><b>'+esc(r.staff_name)+'</b><div class="sm mu">'+esc(r.designation||'')+(num(r.lop_days)?' · LOP '+num(r.lop_days)+' நாள்':'')+'</div></div><div class="r"><b>'+inr(r.net)+'</b><div><span class="chip '+(r.status==='paid'?'ok':'warn')+'">'+(r.status==='paid'?'செலுத்தியது':'நிலுவை')+'</span></div></div></div>').join('');
  return h;
};

   +kv('அடிப்படை',inr(r.basic))+kv('படிகள்',inr(r.allowance))+kv('LOP பிடித்தம்','−'+inr(r.lop_amount));

  h+='<div class="kv"><span class="b">நிகர சம்பளம்</span><span class="b" style="font-size:17px" id="prNet">'+inr(r.net)+'</span></div>'+(paid?kv('செலுத்தியது',dmy(r.paid_on)+' · '+(MODE_TA[r.pay_mode]||r.pay_mode)):'')+'</div>';
  if(!paid)h+='<div class="sec-h">சரிசெய்</div><div class="grid3">'+field('நிலையான பிடித்தம்','pr_de',r.deduction,'inputmode="numeric"')+field('போனஸ்','pr_bo',r.bonus,'inputmode="numeric"')+field('பிற பிடித்தம்','pr_ot',r.other_deduct,'inputmode="numeric"')+'</div>'+field('குறிப்பு','pr_nt',r.note||'')
   +'<button class="btn sec full" data-act="prSave" data-id="'+r.id+'">💾 மாற்றங்களை சேமி</button><div class="grid2" style="margin-top:10px">'+selField('செலுத்தும் முறை','pr_md',modeOpts('Bank'))+'<div style="display:flex;align-items:flex-end;margin-bottom:10px"><button class="btn ok full" data-act="prPay" data-id="'+r.id+'">செலுத்தியது ✔</button></div></div><button class="btn bad full sm" data-act="prDel" data-id="'+r.id+'">இந்த பதிவை நீக்கு</button>';
  else h+='<button class="btn sec full noprint" style="margin-top:10px" onclick="window.print()">🖨 அச்சிடு</button>';

/* ---------- rooms ---------- */
S.rm={rows:null};
const ROOM_KIND={classroom:'வகுப்பறை',lab:'ஆய்வகம்',hall:'அரங்கம்',library:'நூலகம்',office:'அலுவலகம்',other:'மற்றவை'};
const ROOM_STATUS={active:'பயன்பாட்டில்',maintenance:'பராமரிப்பில்',closed:'மூடப்பட்டது'};
LOAD.rooms=async()=>{S.rm.rows=await api('/rooms')};
VIEW.rooms=()=>{
  const rows=S.rm.rows;if(!rows)return spin();
  if(!rows.length)return '<div class="empty">வகுப்பறைகள் இல்லை. கீழே ＋ அழுத்தி சேர்க்கவும்.</div>'+(isDesk()?'<button class="fab" data-act="roomForm">＋</button>':'');
  return rows.map(r=>{const over=num(r.capacity)&&num(r.students)>num(r.capacity);
    return '<div class="card" data-act="roomOpen" data-id="'+r.id+'"><div class="row"><div class="sp"><b>'+esc(r.name)+'</b><div class="sm mu">'+esc([r.building,r.floor_no?'தளம் '+r.floor_no:''].filter(Boolean).join(' · '))+'</div></div><span class="chip">'+(ROOM_KIND[r.kind]||r.kind)+'</span></div>'
     +'<div style="margin-top:6px">'+(r.status!=='active'?'<span class="chip warn">'+ROOM_STATUS[r.status]+'</span>':'')+(num(r.open_issues)?'<span class="chip bad">திறந்த வேலை '+r.open_issues+'</span>':'')+'<span class="chip'+(over?' bad':'')+'">மாணவர் '+num(r.students)+(num(r.capacity)?' / '+r.capacity+' இருக்கை':'')+'</span></div>'
     +(r.used_by?'<div class="sm mu" style="margin-top:4px">பயன்படுத்தும் வகுப்பு: '+esc(r.used_by)+'</div>':'')+'</div>'}).join('')+(isDesk()?'<button class="fab" data-act="roomForm" aria-label="புதிய அறை">＋</button>':'');
};
A.roomForm=async el=>{
  const id=el&&el.dataset.id;let r={kind:'classroom',status:'active'};
  if(id)r=await api('/room/'+id);
  sheet(id?'அறை திருத்து':'புதிய அறை',field('அறை எண் / பெயர் *','rf_n',r.name||'')+'<div class="grid2">'+field('கட்டிடம்','rf_b',r.building||'')+field('தளம்','rf_f',r.floor_no||'')+'</div>'
   +'<div class="grid2">'+selField('வகை','rf_k',opts(Object.keys(ROOM_KIND),r.kind,k=>[k,ROOM_KIND[k]]))+field('இருக்கை எண்ணிக்கை','rf_c',r.capacity||'','inputmode="numeric"')+'</div>'
   +selField('நிலை','rf_s',opts(Object.keys(ROOM_STATUS),r.status,k=>[k,ROOM_STATUS[k]]))+field('குறிப்பு (வசதிகள் போன்றவை)','rf_t',r.notes||'')

  return '<div class="row" style="margin-bottom:10px"><div class="sp b">உள்நுழைவு பயனர்கள்</div><button class="btn sm" data-act="userForm">＋ புதிய பயனர்</button></div>'
   +'<div class="sm mu" style="margin-bottom:8px">அலுவலக பயனர்: மாணவர், கட்டணம், வருகை. ஆசிரியர் பயனர்: தன் வகுப்பின் வருகை மற்றும் தேர்ச்சி முடிவு மட்டும்.</div>'
   +rows.map(u=>'<div class="li" data-act="userForm" data-id="'+u.id+'"><div class="av">'+initials(u.display_name)+'</div><div class="sp"><b>'+esc(u.display_name)+'</b><div class="sm mu">'+esc(u.username)+' · '+(UTYPE[u.user_type]||u.user_type)+(u.staff_name?' · '+esc(u.staff_name):'')+'</div></div>'+(u.active?'':'<span class="chip bad">முடக்கம்</span>')+'</div>').join('');
};
A.userForm=el=>{
  const id=el&&el.dataset.id,u=id?S.us.rows.find(x=>x.id==id):{user_type:'office',active:1};
  const types=['office','teacher'].concat(isAdmin()?['principal']:[]);
  sheet(id?'பயனர் திருத்து':'புதிய பயனர்',field('பெயர்','uf_n',u.display_name||'')+field('பயனர் பெயர் (உள்நுழைய)','uf_u',u.username||'','autocapitalize="none"')
   +field(id?'புதிய கடவுச்சொல் (மாற்ற மட்டும்)':'கடவுச்சொல் (6+ எழுத்துகள்)','uf_p','','type="password" autocomplete="new-password"')
   +selField('வகை','uf_t',opts(types,u.user_type,t=>[t,UTYPE[t]]),'ufType')
   +'<div id="ufStaff" class="'+(u.user_type==='teacher'?'':'hide')+'">'+selField('ஆசிரியர் பதிவு','uf_s',opts(D().teachers,u.staff_id,t=>[t.id,t.name+' ('+t.emp_no+')'],'— தேர்வு செய்'))+'</div>'
   +'<label class="row" style="margin:6px 0 12px"><input type="checkbox" id="uf_a" '+(u.active?'checked':'')+' style="width:20px;height:20px"><span>செயலில் உள்ளது</span></label>'
   +'<button class="btn full" data-act="userSave" data-id="'+(id||'')+'">சேமி</button>'+(id?'<button class="btn bad full" style="margin-top:8px" data-act="userDel" data-id="'+id+'">பயனரை நீக்கு</button>':''));
};
C.ufType=el=>{$('#ufStaff').classList.toggle('hide',el.value!=='teacher')};
A.userSave=async el=>{
  const t=val('uf_t');
  await api('/users','POST',{id:el.dataset.id||null,name:val('uf_n'),username:val('uf_u'),password:$('#uf_p').value,type:t,staffId:t==='teacher'?val('uf_s')||null:null,active:$('#uf_a').checked});
  closeSheet();toast('சேமிக்கப்பட்டது');await LOAD.users();render();
};
A.userDel=async el=>{if(!confirm('இந்த பயனரை நீக்கவா?'))return;await api('/users/'+el.dataset.id,'DELETE');closeSheet();await LOAD.users();render()};

/* ---------- start ---------- */
(async function boot(){
  loadMyIp();
  if(!S.token){render();loadCaptcha();return}
  try{await afterLogin()}catch(e){localLogout()}
})();
</script>
</body>
</html>
