# ---------------- MBill (Mobile Bill) ----------------
# Every value below can be overridden with an environment variable, e.g.
#   DB_URL, DB_USER, DB_PASS, PORT, BMB_ZONE
server.port=${PORT:8080}
spring.jmx.enabled=false
server.compression.enabled=true
server.error.include-message=never

# MySQL 8.0.16+  (database must use utf8mb4 - see db/create-database.sql)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bmb?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:bmb}
spring.datasource.password=${DB_PASS:bmb123}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=mbill-pool

# Create / update tables at every start (CREATE TABLE IF NOT EXISTS - safe to re-run)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# Time zone used for bill dates and "today's sales"
bmb.zone=${BMB_ZONE:Asia/Kolkata}

# Always re-check index.html with the server so phones get the latest app after every update
spring.web.resources.cache.cachecontrol.no-cache=true

# Online translation (master data in other languages). Optional: an official Google Cloud Translation API key; empty = free web endpoint
translate.google.key=${TRANSLATE_GOOGLE_KEY:}
translate.url=${TRANSLATE_URL:}

# WAR in an external Tomcat: Tomcat answers ISO-8859-1 unless this is forced, which garbles every Tamil page (header charset beats <meta charset>)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
