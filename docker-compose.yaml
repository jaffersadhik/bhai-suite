# Bhai Mobile Billing - MySQL 8.4 + Spring Boot app
#   1. cp .env.example .env   (set passwords + MYSQL_DATA_DIR / MYSQL_BACKUP_DIR absolute paths)
#   2. mkdir -p <MYSQL_DATA_DIR> <MYSQL_BACKUP_DIR>
#   3. docker compose up -d --build
#   4. open http://<server>:8080/   Bhai Mobile Billing   first login: admin / admin1234
#      open http://<server>:8081/   MSchool                first login: admin / admin123   (change both at once)
#      open http://<server>:8082/   Meeran Technologies website   (set WEBSITE_PORT=8082 in .env to open it directly)
#
# ONE container (one Tomcat, one JVM) runs MBill, MSchool and the website (three WARs, three ports); the two apps use two separate databases on the same MySQL:
#   MBill -> schema bmb      MSchool -> schema mschool      (the SAME user DB_USER / DB_PASS for both)
name: bhai-mobile-billing

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: bmb
      MYSQL_USER: ${DB_USER:-bmb}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bmb-mysql-data:/var/lib/mysql      # data -> local disk folder MYSQL_DATA_DIR
      - bmb-mysql-backup:/backup           # mysqldump files -> local disk folder MYSQL_BACKUP_DIR
    healthcheck:
      # TCP ping with the app user: succeeds only after MySQL's first-time init has finished
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # no "ports:" on purpose - MySQL is reachable only by the app on the internal network

  # one-shot job, runs on every "up": creates schema mschool if missing and gives the SAME app user (DB_USER) full rights on it.
  # Works on an already running MySQL too (needs MYSQL_ROOT_PASSWORD).
  mschool-db:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      APP_USER: ${DB_USER:-bmb}
    entrypoint:
      - sh
      - -c
      - >-
        mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS mschool CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        GRANT ALL PRIVILEGES ON mschool.* TO '$$APP_USER'@'%'; FLUSH PRIVILEGES;"

  # one-shot job: creates schema mhotel if missing and grants the SAME app user (DB_USER) full rights on it.
  mhotel-db:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      APP_USER: ${DB_USER:-bmb}
    entrypoint:
      - sh
      - -c
      - >-
        mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS mhotel CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        GRANT ALL PRIVILEGES ON mhotel.* TO '$$APP_USER'@'%'; FLUSH PRIVILEGES;"

  # one-shot job: creates schema po_mgmt if missing and grants the SAME app user (DB_USER) full rights on it.
  po-mgmt-db:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      APP_USER: ${DB_USER:-bmb}
    entrypoint:
      - sh
      - -c
      - >-
        mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS po_mgmt CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        GRANT ALL PRIVILEGES ON po_mgmt.* TO '$$APP_USER'@'%'; FLUSH PRIVILEGES;"

  app:
    build:
      context: .
      args:
        BUILD_ID: "${BUILD_ID:-}"
    image: bhai-mobile-billing:1.0.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mschool-db:
        condition: service_completed_successfully
      mhotel-db:
        condition: service_completed_successfully
      po-mgmt-db:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/bmb?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER:-bmb}
      DB_PASS: ${DB_PASS}
      BMB_ZONE: Asia/Kolkata
      # --- MSchool: own schema "mschool" on the same MySQL server, same credentials as MBill ---
      MSCHOOL_DB_URL: "${MSCHOOL_DB_URL:-jdbc:mysql://mysql:3306/mschool?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata}"
      MSCHOOL_DB_USER: ${DB_USER:-bmb}
      MSCHOOL_DB_PASS: ${DB_PASS}
      MSCHOOL_ZONE: Asia/Kolkata
      # --- mHotel: own schema "mhotel" on the same MySQL server, same credentials as MBill ---
      MHOTEL_DB_URL: "${MHOTEL_DB_URL:-jdbc:mysql://mysql:3306/mhotel?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata}"
      MHOTEL_DB_USER: ${DB_USER:-bmb}
      MHOTEL_DB_PASS: ${DB_PASS}
      MHOTEL_ZONE: Asia/Kolkata
      MHOTEL_WEBHOOK_SECRET: ${MHOTEL_WEBHOOK_SECRET:-}            # Swiggy/Zomato webhook shared secret (empty = webhook disabled)
      # --- Purchase Order Management: own schema "po_mgmt" on the same MySQL, same credentials ---
      POMGMT_DB_URL: "${POMGMT_DB_URL:-jdbc:mysql://mysql:3306/po_mgmt?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Kolkata}"
      POMGMT_DB_USER: ${DB_USER:-bmb}
      POMGMT_DB_PASS: ${DB_PASS}
      POMGMT_ZONE: Asia/Kolkata
      POMGMT_BUDGET_ENFORCEMENT: ${POMGMT_BUDGET_ENFORCEMENT:-warn}   # off | warn | strict
      POMGMT_LOG_LEVEL: ${POMGMT_LOG_LEVEL:-INFO}                     # DEBUG = log every login (user, pass length, hash match, pass/fail) to the container log; INFO normal; ERROR quiet
      # --- login security (captcha + per-IP failure counting + IP block) - same for MBill and MSchool, see SUITE.md "Login security" ---
      LOGIN_CAPTCHA: ${LOGIN_CAPTCHA:-true}                       # false = no captcha (the IP block stays)
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-10}                     # more than this many wrong user/password tries from one IP in a day -> IP blocked
      LOGIN_MAX_CAPTCHA_FAILS: ${LOGIN_MAX_CAPTCHA_FAILS:-40}     # wrong captcha tries per IP per day before the IP is blocked
      IP_BLOCK_HOURS: ${IP_BLOCK_HOURS:-0}                        # 0 = block stays until a System user unblocks; N = auto-unblock after N hours
      IP_BLOCK_EXEMPT: ${IP_BLOCK_EXEMPT:-127.0.0.1,::1}          # never blocked (comma list; add your office / shop IP if you wish)
      TZ: Asia/Kolkata
    ports:
      - "${APP_PORT:-8080}:8080"                       # Bhai Mobile Billing
      - "${SCHOOL_PORT:-127.0.0.1:8081}:8081"          # MSchool (localhost only by default; Caddy publishes it with SCHOOL_DOMAIN. Set SCHOOL_PORT=8081 to open it directly)
      - "${WEBSITE_PORT:-127.0.0.1:8082}:8082"         # Meeran Technologies website (localhost only by default; Caddy publishes it with WEBSITE_DOMAIN. Set WEBSITE_PORT=8082 to open it directly)
      - "${HOTEL_PORT:-127.0.0.1:8083}:8083"           # mHotel (localhost only by default; Caddy publishes it with HOTEL_DOMAIN. Set HOTEL_PORT=8083 to open it directly)
      - "${PO_PORT:-127.0.0.1:8084}:8084"              # Purchase Order Management (localhost only by default; Caddy publishes it with PO_DOMAIN. Set PO_PORT=8084 to open it directly)
    volumes:
      - "${CTL_DIR:-./ctl}:/ctl"                       # build info + rollback requests (deploy/oracle scripts)

volumes:
  # Named volumes stored in folders on the local disk (bind). The folders must exist first.
  bmb-mysql-data:
    name: bmb-mysql-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_DIR:?set MYSQL_DATA_DIR in .env (absolute path)}
  bmb-mysql-backup:
    name: bmb-mysql-backup
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_BACKUP_DIR:?set MYSQL_BACKUP_DIR in .env (absolute path)}
