# Optional HTTPS front for Bhai Mobile Billing (needed for the phone-camera barcode scanner:
# browsers open the camera only on https:// pages).
#
# Needs a domain name pointing to this server (DNS A record -> EC2 public IP) and
# ports 80 + 443 open in the EC2 security group. Caddy gets and renews the
# Let's Encrypt certificate by itself.
#
#   1. in .env set   DOMAIN=billing.example.com
#   2. docker compose -f docker-compose.yaml -f docker-compose.https.yaml up -d --build
#   3. open https://billing.example.com/
#
# MSchool (same container, port 8081) on its own address - optional:
#   in .env also set   SCHOOL_DOMAIN=school.example.com   (A record -> this server)   then up -d again.
name: bhai-mobile-billing

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:-:8081}
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - bmb-caddy-data:/data
      - bmb-caddy-config:/config

volumes:
  bmb-caddy-data:
  bmb-caddy-config:
