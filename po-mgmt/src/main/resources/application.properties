# standalone (java -jar) only; inside Tomcat the port is set in tomcat/server.xml
server.port=${POMGMT_PORT:8084}
spring.jmx.enabled=false
spring.application.name=po-mgmt

spring.datasource.url=${POMGMT_DB_URL:jdbc:mysql://localhost:3306/po_mgmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${POMGMT_DB_USER:root}
spring.datasource.password=${POMGMT_DB_PASS:root}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=po-mgmt-pool

# schema.sql is CREATE TABLE IF NOT EXISTS, runs on every start. Column changes for existing DBs go in Migrations.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# phones must reload index.html after an update
spring.web.resources.cache.cachecontrol.no-cache=true

# time zone used for "today", PO dates and receipts
po.zone=${POMGMT_ZONE:Asia/Kolkata}

# budget rule: off = ignore, warn = allow but warn (default), strict = PO needs an approved budget first
po.budget.enforcement=${POMGMT_BUDGET_ENFORCEMENT:warn}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
spring.jackson.default-property-inclusion=always

# WAR in an external Tomcat: force UTF-8 or Tamil pages garble
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
