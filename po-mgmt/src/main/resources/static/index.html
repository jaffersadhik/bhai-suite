<title>Purchase Order Management</title>
<style>
:root{--pri:#0e6b4a;--pri2:#14805a;--pri-d:#09442f;--pri-l:#dff0e7;--gold:#e9b431;--gold-l:#fbe7ac;--bg:#f2f7f4;--card:#fff;--line:#dbe6df;--tx:#14231c;--mu:#5f6f66;--ok:#1faa59;--ok-l:#e3f5ea;--bad:#b3261e;--bad-l:#fdecea;--warn:#d9770a;--warn-l:#fff1dc;--r:14px;
--body:'DM Sans','Noto Sans Tamil','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Arabic',system-ui,sans-serif;--head:'Mukta Malar','DM Sans','Noto Sans Tamil',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.4}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#bar .mark{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--pri-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:17px;flex:none}
#bar .t{flex:1;min-width:0}#bar .t b{display:block;font-family:var(--head);font-weight:800;font-size:17px}#bar .t small{color:var(--gold-l);font-weight:600;font-size:12px}
#bar button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:11px;padding:6px 10px;font-size:16px;min-height:38px;font-weight:700}
#main{flex:1;padding:12px 12px 84px}
#dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
#dock button{flex:1;border:0;background:none;padding:8px 2px 7px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
#dock button i{font-style:normal;font-size:20px}#dock button.on{color:var(--pri);font-weight:700}
h1,h2,h3{font-family:var(--head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.mu{color:var(--mu)}.sm{font-size:12px}.b{font-weight:700}.rt{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.pri b{color:var(--pri)}
button,input,select,textarea{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:600}
.btn.sec{background:var(--pri-l);color:var(--pri)}.btn.bad{background:var(--bad-l);color:var(--bad)}.btn.gold{background:var(--gold);color:var(--pri-d)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}.btn.full{width:100%}
.f{display:block;margin-bottom:10px}.f>span{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
.pwwrap{position:relative}.pwwrap input{padding-right:44px}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;padding:6px;color:var(--mu)}
.seg{display:flex;flex-wrap:wrap;background:#e3eee8;border-radius:11px;padding:3px;margin-bottom:10px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--mu);font-size:12.5px}.seg button.on{background:#fff;color:var(--pri);font-weight:700}
.chip{display:inline-block;background:var(--pri-l);color:var(--pri);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0;font-weight:700}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.warn{background:var(--warn-l);color:var(--warn)}
.br-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.br-grid label{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:12px;font-weight:700;cursor:pointer}
.br-grid label.on{background:var(--pri);color:#fff;border-color:var(--pri)}.br-grid input{display:none}
.szrow{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;margin-bottom:6px}.szrow b{font-family:var(--head)}
table.rep{width:100%;border-collapse:collapse;font-size:13px}table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left}table.rep th{color:var(--mu);font-weight:700;font-size:11.5px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:92%;background:#14231c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;white-space:pre-line}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.lg #app{background:linear-gradient(160deg,#0e6b4a 0%,#09442f 100%)}
.login{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;color:#fff;position:relative}
.langbtn{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;padding:8px 11px;font-size:16px;font-weight:700}
.login .lmark{width:72px;height:72px;border-radius:22px;background:var(--gold);color:var(--pri-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:30px;margin:0 auto 12px}
.login h1{font-family:var(--head);font-size:25px;font-weight:800;margin:6px 0 0;color:#fff;text-align:center}.login h1 span{color:var(--gold)}
.login .tag{font-size:13px;opacity:.88;margin:4px 0 18px;text-align:center}
.lcard{background:var(--bg);color:var(--tx);border-radius:22px;padding:20px 16px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.lcard h2{font-family:var(--head);font-size:20px;font-weight:800;margin:0 0 10px}
.cap{display:flex;gap:8px;align-items:stretch;margin:2px 0 8px}
.cap .capimg{flex:1;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:2px;display:flex;align-items:center;justify-content:center;min-height:56px}
.cap .capimg img{width:100%;max-width:230px;height:auto}
.cap .caprf{flex:0 0 48px;border:1.5px solid var(--line);border-radius:12px;background:var(--pri-l);color:var(--pri-d);font-size:20px}
.lerr{display:none;margin:10px 0 0;background:var(--bad-l);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}.lerr.on{display:block}
.lfoot{text-align:center;font-size:12px;opacity:.85;margin-top:14px}
.sheet{position:fixed;inset:0;background:rgba(9,30,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{position:relative;background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:14px 16px calc(36px + env(safe-area-inset-bottom));max-height:90dvh;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .inner::before{content:"";position:sticky;top:0;display:block;width:40px;height:4px;border-radius:3px;background:var(--line);margin:-4px auto 8px}
.sheet .inner h3{margin:2px 0 10px;padding-right:40px}
.sheet-x{position:absolute;right:10px;top:12px;background:var(--bg);border:0;border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--mu);z-index:4}
.urole{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px 40px 10px 12px;margin-bottom:8px;cursor:pointer;position:relative}
.urole input{position:absolute;right:12px;top:14px;width:18px;height:18px}
.urole b{display:block;font-size:14px}.urole small{color:var(--mu);font-size:12px}
.urole.on{border-color:var(--pri);background:var(--pri-l)}
.urow{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:14px}.urow input{width:18px;height:18px}
</style>
</head>

function tr(raw){raw=raw==null?'':String(raw);for(const row of SRV){try{if(row[0](raw))return row[1][LANG]||row[1].en||raw}catch(e){}}return raw}
function setLang(l){LANG=l;localStorage.setItem('po_lang',l);document.documentElement.lang=l;document.documentElement.dir=(l==='ar')?'rtl':'ltr';if(S.token)render();else renderLogin()}

const PST={draft:'Draft',pending:'Pending',approved:'Approved',rejected:'Rejected',sent:'Sent',partial:'Partial',completed:'Completed',cancelled:'Cancelled'};
const pcls=s=>({approved:'ok',completed:'ok',rejected:'bad',cancelled:'bad'})[s]||'warn';
let S={token:localStorage.getItem('po_token'),me:null,data:null,dash:null,view:'home',entry:null,posData:null,posFlt:'pending',budgets:null,rep:null,repKind:'budget_vs_ordered',cap:{}};

async function api(path,method,body){
  const r=await fetch('/api'+path,{method:method||'GET',headers:{'Content-Type':'application/json',...(S.token?{'X-Auth':S.token}:{})},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&S.token&&path!=='/login'){localLogout();throw Object.assign(new Error((j&&j.error)||'Login again'),{status:r.status})}
  if(!r.ok) throw Object.assign(new Error((j&&j.error)||('Error '+r.status)),{status:r.status,captcha:j&&j.captcha,blocked:j&&j.blocked});
  return j;
}
function toast(m,err){const el=$('#toast');el.textContent=m;el.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',err?5000:2600)}
function langSheet(){
  const el=document.createElement('div');el.className='sheet';el.onclick=e=>{if(e.target===el)el.remove()};
  el.innerHTML=`<div class="inner"><h3>Language / மொழி</h3>${LANGS.map(l=>`<button class="btn ${l[0]===LANG?'':'sec'} full" data-l="${l[0]}" style="margin-bottom:8px">${l[1]}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{el.remove();setLang(b.dataset.l)});
  document.body.appendChild(el);
}

      ${c.enabled?`<label class="f" style="margin-bottom:4px"><span>Captcha</span></label>

    </div><p class="lfoot">Meeran Technologies</p></div>`;
  document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  $('#lbtn').onclick=doLogin; $('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
  $('#eye').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password';$('#eye').textContent=p.type==='password'?'👁':'🙈'};

async function doLogin(){
  const user=$('#lu').value.trim(),password=$('#lp').value,captcha=$('#lc')?$('#lc').value.trim():'';
  if(!user||!password){S.lerr=t('Username')+' / '+t('Password')+' ?';$('#le').textContent=S.lerr;$('#le').className='lerr on';return}
  S.lerr='';$('#lbtn').disabled=true;
  try{const r=await api('/login','POST',{user,password,captchaId:(S.cap&&S.cap.id)||'',captcha});
    S.token=r.token;localStorage.setItem('po_token',r.token);S.me=r.me;S.lerr='';document.body.classList.remove('lg');await boot()}
  catch(e){S.lerr=tr(e.message)||'Login failed';$('#lbtn').disabled=false;
    // reload captcha (fresh picture each attempt) and keep the error visible via S.lerr; if no reload, show it directly
    if(e.status!==undefined&&e.status!==0){await loadCaptcha()}else{$('#le').textContent=S.lerr;$('#le').className='lerr on'}}
}
function localLogout(){S.token=null;S.me=null;S.data=null;localStorage.removeItem('po_token');loadCaptcha()}

function render(){
  if(!S.token){loadCaptcha();return}
  document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  const v=S.view,dock=[['home','🏠','Home'],['new','➕','New PO'],['pos','🧾','POs'],['budget','🎯','Budget'],['more','⋯','More']];

    <div id="main">${screen(v)}</div>

function bindNew(){
  if(!S.data.canCreate)return;const e=S.entry;
  const re=()=>{if($('#eSup'))e.supplierId=$('#eSup').value;if($('#eAg'))e.agencyId=$('#eAg').value;if($('#ePeriod'))e.period=$('#ePeriod').value;if($('#eObr'))e.orderBookRef=$('#eObr').value;if($('#eDel'))e.deliveryDate=$('#eDel').value;if($('#eRem'))e.remarks=$('#eRem').value};
  if($('#eSup'))$('#eSup').onchange=()=>{re();e.agencyId='';render()};
  if($('#poBranch'))$('#poBranch').onchange=()=>{re();e.branches=$('#poBranch').value?[$('#poBranch').value]:[]};
  if($('#poCsv'))$('#poCsv').onclick=()=>{re();poCsvSheet()};
  if($('#addItem'))$('#addItem').onclick=()=>{re();const cat=(catList()[0]||'');const first=itemsInCat(cat)[0];e.items.push({cat,itemId:first?first.id:'',rate:'',qty:{}});render()};
  document.querySelectorAll('[data-rmit]').forEach(b=>b.onclick=()=>{re();e.items.splice(+b.dataset.rmit,1);render()});
  document.querySelectorAll('[data-cat]').forEach(s=>s.onchange=()=>{re();const it=e.items[+s.dataset.cat];it.cat=s.value;const first=itemsInCat(s.value)[0];it.itemId=first?first.id:'';it.qty={};render()});
  document.querySelectorAll('[data-item]').forEach(s=>s.onchange=()=>{re();e.items[+s.dataset.item].itemId=s.value;e.items[+s.dataset.item].qty={};render()});

  if($('#eSubmit'))$('#eSubmit').onclick=()=>submitEntry(false);

async function submitEntry(allow,reason){
  const e=S.entry;
  if($('#eSup'))e.supplierId=$('#eSup').value;if($('#eAg'))e.agencyId=$('#eAg').value;if($('#ePeriod'))e.period=$('#ePeriod').value;if($('#eDel'))e.deliveryDate=$('#eDel').value;if($('#eRem'))e.remarks=$('#eRem').value;if($('#eObr'))e.orderBookRef=$('#eObr').value;
  if(!e.supplierId){toast(t('Select supplier'),true);return}
  if(!e.branches.length){toast(t('Select a branch'),true);return}
  const lines=[];
  e.items.forEach(it=>{const sizes=((S.data.items||[]).find(x=>String(x.id)===String(it.itemId))||{}).sizes||[];sizes.forEach(sz=>{const q=+((it.qty||{})[sz]||0);if(q>0)lines.push({item:it.itemId,size:sz,qty:q,rate:+it.rate||0})})});
  if(!lines.length){toast(t('Enter size-wise quantity'),true);return}
  const body={supplierId:+e.supplierId,agencyId:+e.agencyId||null,period:e.period,orderBookRef:e.orderBookRef,deliveryDate:e.deliveryDate,remarks:e.remarks,branches:e.branches,lines,allowOverBudget:!!allow,exceptionReason:reason||''};
  try{const r=await api('/entry','POST',body);S.entry=null;
    toast('✅ '+r.commonRef+' ('+r.totalQty+' pcs)');createdSheet(r);
    S.view='pos';S.posFlt='pending';render();loadPos();
  }catch(e2){const raw=String(e2.message||'');if(raw.includes('Budget')||raw.includes('budget')||raw.includes('பட்ஜெட்')){overBudgetSheet(e2.message)}else toast(tr(e2.message),true)}
}
function overBudgetSheet(msg){
  const el=sheetEl(`<h3>⚠ ${esc(t('Over budget'))}</h3><p class="sm" style="color:var(--bad)">${esc(tr(msg))}</p>
    <label class="f"><span>${esc(t('Exception reason'))}</span><textarea id="ob_r" rows="3" style="width:100%"></textarea></label>
    <button class="btn bad full" id="ob_go">${esc(t('Proceed over budget'))}</button>`);
  el.querySelector('#ob_go').onclick=()=>{const r=el.querySelector('#ob_r').value.trim();if(!r){toast(t('Exception reason')+' ?',true);return}el.remove();submitEntry(true,r)};
}
function createdSheet(r){
  const el=sheetEl(`<h3>✅ ${esc(r.commonRef)}</h3>
    ${(r.branchPos||[]).map(p=>`<div class="card" style="background:var(--bg);margin-bottom:6px"><div class="row"><div class="sp"><b>${esc(p.poNumber)}</b> · ${esc(p.branch)}<div class="mu sm">${p.totalQty} pcs · ${inr(p.amount)}${p.overBudget?' ⚠':''}</div></div><button class="btn sec sm" data-pp="${esc(p.poNumber)}">🖨 ${esc(t('Print'))}</button></div></div>`).join('')}
    <button class="btn full" id="cs_done">${esc(t('Done'))}</button>`);
  el.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>printPo(b.dataset.pp));
  el.querySelector('#cs_done').onclick=()=>el.remove();

function poCsvSheet(){
  const el=sheetEl(`<h3>${esc(t('Upload items (CSV)'))}</h3>
    <p class="mu sm">${esc(t('Columns'))}: <b>item_code, size, qty, rate</b></p>
    <button class="btn sec sm" id="poSmp" style="margin-bottom:8px">⬇ ${esc(t('Sample CSV'))}</button>
    <label class="f"><input type="file" id="poF" accept=".csv,text/csv"></label>
    <label class="f">${esc(t('or paste CSV'))}<textarea id="poT" rows="6" style="width:100%;font-family:monospace" placeholder="item_code,size,qty,rate&#10;SHIRT-001,M,10,250"></textarea></label>
    <button class="btn full" id="poGo">${esc(t('Add to PO'))}</button>`);
  el.querySelector('#poSmp').onclick=()=>{const csv="item_code,size,qty,rate\nSHIRT-001,M,10,250\nSHIRT-001,L,5,250\n";const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='po-items-sample.csv';a.click()};
  el.querySelector('#poGo').onclick=async()=>{
    const f=el.querySelector('#poF');let csv=el.querySelector('#poT').value;if(f&&f.files&&f.files[0]){try{csv=await f.files[0].text()}catch(e){}}
    csv=(csv||'').trim();if(!csv){toast(t('Give CSV'),true);return}
    const rows=csv.replace(/\r/g,'').split('\n');const head=rows[0].toLowerCase().split(',').map(x=>x.trim());
    const ci=head.indexOf('item_code'),cs=head.indexOf('size'),cq=head.indexOf('qty'),cr=head.indexOf('rate');
    if(ci<0||cs<0||cq<0){toast('CSV: item_code, size, qty',true);return}
    const items=S.data.items||[],e=S.entry;let added=0,skipped=0;const byCode={};
    for(let r=1;r<rows.length;r++){if(!rows[r].trim())continue;const f2=rows[r].split(',').map(x=>x.trim());const it=items.find(x=>x.item_code===f2[ci]);if(!it){skipped++;continue;}
      let entry=byCode[f2[ci]];if(!entry){entry=e.items.find(x=>String(x.itemId)===String(it.id))||{itemId:it.id,cat:(it.category||'').trim(),rate:'',qty:{}};if(!e.items.includes(entry))e.items.push(entry);byCode[f2[ci]]=entry;}
      if((it.sizes||[]).includes(f2[cs])){entry.qty[f2[cs]]=(+f2[cq]||0);if(cr>=0&&f2[cr])entry.rate=+f2[cr];added++;}else skipped++;}
    el.remove();render();toast(t('Added')+': '+added+' · '+t('Skipped')+': '+skipped);
  };
}

  const el=sheetEl(`<h3>${esc(t('Branch management'))}</h3>
    <button class="btn full" id="brAdd" style="margin-bottom:10px">➕ ${esc(t('Add branch'))}</button>
    ${(S.data.branches||[]).map(b=>`<div class="card" style="background:var(--bg);margin-bottom:6px"><div class="row"><div class="sp"><b>${esc(b.code)}</b> ${esc(b.name)} <span class="chip">${esc(brTypeLabel(b.type))}</span>${b.active?'':' <span class="chip bad">'+esc(t('Inactive'))+'</span>'}${b.address?`<div class="mu sm">${esc(b.address)}</div>`:''}</div>
      <button class="btn sec sm" data-eb='${esc(JSON.stringify(b))}'>✎</button></div></div>`).join('')}`);
  el.querySelector('#brAdd').onclick=()=>{el.remove();branchForm(null)};
  el.querySelectorAll('[data-eb]').forEach(x=>x.onclick=()=>{el.remove();branchForm(JSON.parse(x.dataset.eb))});
}
function branchForm(b){
  const ed=!!b;
  const el=sheetEl(`<h3>${ed?esc(t('Edit branch')):esc(t('Add branch'))}</h3>
    <div class="grid2"><label class="f"><span>${esc(t('Branch code'))}</span><input id="bf_code" maxlength="8" autocapitalize="characters" value="${ed?esc(b.code):''}" placeholder="R16"></label>
    <label class="f"><span>${esc(t('Type'))}</span><select id="bf_type">${BR_TYPES.map(tp=>`<option value="${tp[0]}" ${((ed?b.type:'branch')===tp[0])?'selected':''}>${esc(t(tp[1]))}</option>`).join('')}</select></label></div>
    <label class="f"><span>${esc(t('Branch name'))}</span><input id="bf_name" value="${ed?esc(b.name):''}"></label>
    <label class="f"><span>${esc(t('Address'))}</span><input id="bf_addr" value="${ed?esc(b.address||''):''}"></label>
    <label class="urow"><input type="checkbox" id="bf_active" ${(!ed||b.active)?'checked':''}> ${esc(t('Active'))}</label>
    <button class="btn full" id="bf_save" style="margin-top:10px">${ed?esc(t('Save')):esc(t('Add branch'))}</button>`);
  el.querySelector('#bf_save').onclick=async()=>{
    const body={code:el.querySelector('#bf_code').value.trim(),name:el.querySelector('#bf_name').value.trim(),type:el.querySelector('#bf_type').value,address:el.querySelector('#bf_addr').value.trim(),active:el.querySelector('#bf_active').checked};
    if(ed)body.id=b.id;
    if(!body.code||!body.name){toast(t('Branch code')+' / '+t('Branch name')+' ?',true);return}
    try{await api('/branches','POST',body);S.data=await api('/data');toast(ed?t('Saved'):t('Branch added'));el.remove();branchesSheet()}catch(e){toast(tr(e.message),true)}
  };
}

/* ---------------- masters: supplier / agency / item forms ---------------- */
function supplierForm(){
  const el=sheetEl(`<h3>${esc(t('Add supplier'))}</h3>
    <label class="f"><span>${esc(t('Supplier name'))} *</span><input id="sf_name"></label>
    <div class="grid2"><label class="f"><span>${esc(t('GSTIN'))}</span><input id="sf_gst" autocapitalize="characters" autocorrect="off"></label>
    <label class="f"><span>${esc(t('Mobile'))}</span><input id="sf_mob" inputmode="numeric"></label></div>
    <label class="f"><span>${esc(t('Contact person'))}</span><input id="sf_cp"></label>
    <label class="f"><span>${esc(t('Address'))}</span><input id="sf_addr"></label>
    <div class="grid2"><label class="f"><span>${esc(t('Payment terms'))}</span><input id="sf_pt" placeholder="30 days"></label>
    <label class="f"><span>${esc(t('Credit days'))}</span><input id="sf_cd" inputmode="numeric" value="0"></label></div>
    <button class="btn full" id="sf_save" style="margin-top:8px">${esc(t('Add supplier'))}</button>`);
  el.querySelector('#sf_save').onclick=async()=>{
    const body={name:el.querySelector('#sf_name').value.trim(),gstin:el.querySelector('#sf_gst').value.trim(),mobile:el.querySelector('#sf_mob').value.trim(),contactPerson:el.querySelector('#sf_cp').value.trim(),address:el.querySelector('#sf_addr').value.trim(),paymentTerms:el.querySelector('#sf_pt').value.trim(),creditDays:+el.querySelector('#sf_cd').value||0};
    if(!body.name){toast(t('Supplier name')+' ?',true);return}
    try{await api('/suppliers','POST',body);S.data=await api('/data');toast(t('Added'));el.remove()}catch(e){toast(tr(e.message),true)}
  };
}
function agencyForm(){
  const sups=S.data.suppliers||[];
  if(!sups.length){toast(t('Add a supplier first'),true);return}
  const el=sheetEl(`<h3>${esc(t('Add agency'))}</h3>
    <label class="f"><span>${esc(t('Supplier'))} *</span><select id="af_sup">${sups.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <label class="f"><span>${esc(t('Agency name'))} *</span><input id="af_name"></label>
    <label class="f"><span>${esc(t('Location'))}</span><input id="af_loc"></label>
    <button class="btn full" id="af_save" style="margin-top:8px">${esc(t('Add agency'))}</button>`);
  el.querySelector('#af_save').onclick=async()=>{
    const body={supplierId:+el.querySelector('#af_sup').value,name:el.querySelector('#af_name').value.trim(),location:el.querySelector('#af_loc').value.trim()};
    if(!body.name){toast(t('Agency name')+' ?',true);return}
    try{await api('/agencies','POST',body);S.data=await api('/data');toast(t('Agency added'));el.remove()}catch(e){toast(tr(e.message),true)}
  };
}
function itemForm(){
  const el=sheetEl(`<h3>${esc(t('Add item (master)'))}</h3>
    <div class="grid2"><label class="f"><span>${esc(t('Item code'))} *</span><input id="if_code"></label>
    <label class="f"><span>${esc(t('GST %'))}</span><input id="if_gst" inputmode="decimal" value="5"></label></div>
    <label class="f"><span>${esc(t('Description'))} *</span><input id="if_desc"></label>
    <div class="grid2"><label class="f"><span>${esc(t('Category'))}</span><input id="if_cat"></label>
    <label class="f"><span>${esc(t('Brand'))}</span><input id="if_brand"></label></div>
    <div class="grid2"><label class="f"><span>${esc(t('Colour'))}</span><input id="if_col"></label>
    <label class="f"><span>${esc(t('HSN'))}</span><input id="if_hsn" inputmode="numeric"></label></div>
    <label class="f"><span>${esc(t('Sizes (comma separated)'))}</span><input id="if_sizes" value="S,M,L,XL,XXL"></label>
    <button class="btn full" id="if_save" style="margin-top:8px">${esc(t('Add item (master)'))}</button>`);
  el.querySelector('#if_save').onclick=async()=>{
    const sizes=(el.querySelector('#if_sizes').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const body={itemCode:el.querySelector('#if_code').value.trim(),description:el.querySelector('#if_desc').value.trim(),category:el.querySelector('#if_cat').value.trim(),brand:el.querySelector('#if_brand').value.trim(),colour:el.querySelector('#if_col').value.trim(),hsn:el.querySelector('#if_hsn').value.trim(),gstPct:+el.querySelector('#if_gst').value||0,sizes};
    if(!body.itemCode||!body.description){toast(t('Item code')+' / '+t('Description')+' ?',true);return}
    try{await api('/items','POST',body);S.data=await api('/data');toast(t('Item added'));el.remove()}catch(e){toast(tr(e.message),true)}
  };
}

/* ---------------- start ---------------- */
window.S=S;document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
if(S.token)boot();else loadCaptcha();
</script>
